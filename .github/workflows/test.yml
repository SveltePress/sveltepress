name: Test

on:
  push:
    branches:
      - main
      - changeset-release/main
  pull_request:
    types: [opened, synchronize, ready_for_review, auto_merge_enabled]

jobs:
  docs:
    name: Check documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Restore version page artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/docs-site/.sveltepress/version-artifacts
            packages/docs-site/.sveltepress/version-artifacts-zh
            packages/docs-site/.sveltepress/version-artifacts-bn
          key: sveltepress-page-artifacts-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sveltepress-page-artifacts-${{ runner.os }}-
      - name: Install Dependencies
        run: pnpm i
      - name: Check docs
        run: pnpm check:docs
      - name: Build versioned docs
        run: pnpm check:versioning-build

  vitest:
    name: Running tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install Dependencies
        run: pnpm i
      - name: Test
        run: pnpm test
